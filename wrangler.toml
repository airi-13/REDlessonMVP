name = "redlesson-mvp"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "redlesson"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
APP_TIMEZONE = "Asia/Tokyo"
ADMIN_USER = "admin"
# Set ADMIN_PASSWORD as a secret; never commit it.
