name: Apply RED brand UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  brand:
    if: ${{ !contains(github.event.head_commit.message, 'Apply RED brand UI') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply branding
        shell: python
        run: |
          from pathlib import Path
          import re
          mark='<span class="brand-mark">RED</span><span class="brand-name">自立学習RED</span><span class="brand-sub">授業管理</span>'
          css='body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f7f7;color:#242424}header{background:#d71920;color:#fff;padding:16px 22px;box-shadow:0 2px 10px #0002}header strong{display:flex;align-items:center;gap:10px}.brand-mark{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#d71920;font-weight:900;font-style:italic;letter-spacing:-1px;border-radius:6px;padding:2px 8px;font-size:22px;line-height:1}.brand-name{font-weight:800;font-size:20px}.brand-sub{font-size:13px;font-weight:600;opacity:.9;border-left:1px solid #ffffff66;padding-left:10px}.card{border:1px solid #eee;box-shadow:0 2px 10px #0000000d}input:focus,select:focus{outline:2px solid #d7192044;border-color:#d71920}button{background:#d71920!important;font-weight:700}button:hover{background:#b9151b!important}'
          for name in ['src/index.ts','src/admin.ts']:
            p=Path(name); s=p.read_text()
            if 'brand-mark' not in s: s=s.replace('RED授業管理簡易VER',mark,1)
            s=re.sub(r'<style>.*?</style>','<style>'+css+'</style>',s,count=1)
            title='自立学習RED｜授業管理｜管理者' if name.endswith('admin.ts') else '自立学習RED｜授業管理'
            s=re.sub(r'<title>.*?</title>', '<title>'+title+'</title>', s, count=1)
            p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts src/admin.ts
          git diff --cached --quiet && exit 0
          git commit -m "Apply RED brand UI"
          git push
