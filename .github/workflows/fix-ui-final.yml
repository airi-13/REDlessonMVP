name: Fix UI final
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix UI final') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize UI and repair login source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/index.ts')
          s=p.read_text()
          bad="\n},k,256);return b64(bits)===b}catch{return false}}"
          if bad in s:
              s=s.replace(bad,'',1)
          s=s.replace('#d71920','#D13C18').replace('#D71920','#D13C18')
          s=s.replace('#b9151b','#A82F12')
          s=re.sub(r'\.brand-mark\{.*?\}', '', s)
          s=re.sub(r'\.brand-name\{.*?\}', '', s)
          s=re.sub(r'\.brand-sub\{.*?\}', '', s)
          s=s.replace('header{background:#D13C18;color:#fff;', 'header{background:#fff;color:#242424;')
          s=s.replace('header{background:#d71920;color:#fff;', 'header{background:#fff;color:#242424;')
          p.write_text(s)

          for name in ['src/admin.ts']:
              p=Path(name); s=p.read_text()
              s=s.replace('#d71920','#D13C18').replace('#D71920','#D13C18')
              s=s.replace('#b9151b','#A82F12')
              s=re.sub(r'\.brand-mark\{.*?\}', '', s)
              s=re.sub(r'\.brand-name\{.*?\}', '', s)
              s=re.sub(r'\.brand-sub\{.*?\}', '', s)
              s=s.replace('header{background:#D13C18;color:#fff;', 'header{background:#fff;color:#242424;')
              s=s.replace('header{background:#d71920;color:#fff;', 'header{background:#fff;color:#242424;')
              p.write_text(s)
          PY
      - name: Validate TypeScript
        run: |
          npm ci
          npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.ts src/admin.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Fix UI final'
          git push
