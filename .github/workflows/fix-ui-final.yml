name: Fix UI final
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix UI final') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair client JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/index.ts'); s=p.read_text()
          s=s.replace('#d71920','#D13C18').replace('#D71920','#D13C18').replace('#b9151b','#A82F12')
          s=re.sub(r'\.brand-mark\{.*?\}', '', s); s=re.sub(r'\.brand-name\{.*?\}', '', s); s=re.sub(r'\.brand-sub\{.*?\}', '', s)
          s=s.replace('header{background:#D13C18;color:#fff;', 'header{background:#fff;color:#242424;').replace('header{background:#d71920;color:#fff;', 'header{background:#fff;color:#242424;')
          if '<link rel="icon" href="data:,">' not in s:
              s=s.replace('<meta name="viewport" content="width=device-width,initial-scale=1">', '<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">')
          s=s.replace('<button type="button" class="password-toggle" onclick="togglePassword()"', '<button type="button" class="password-toggle"')
          s=s.replace('<button class="login-submit" onclick="login()">ログイン</button>', '<button type="button" class="login-submit">ログイン</button>')
          s=s.replace('<button class="logout" onclick="logout()">ログアウト</button>', '<button type="button" class="logout">ログアウト</button>')
          s=s.replace('async function login(e){', 'async function doLogin(e){', 1)
          s=s.replace("button.addEventListener('click',login)", "button.addEventListener('click',doLogin)")
          s=s.replace('login(e)', 'doLogin(e)')
          s=re.sub(r'async function loadSlots\(id\)\{.*?\nasync function absence', """async function loadSlots(id){
            try{
              const d=await api('/api/me/makeup-slots?entitlementId='+encodeURIComponent(id));
              const el=$('slots-'+id); if(!el)return; el.innerHTML='';
              if(!d.slots.length){el.textContent='現在、選択できる振替枠はありません。';return}
              for(const x of d.slots){
                const row=document.createElement('div'); row.className='slot';
                const span=document.createElement('span'); span.textContent=x.date+'（'+x.weekdayLabel+'） '+x.period+'限 '+x.start+'–'+x.end;
                const button=document.createElement('button'); button.type='button'; button.textContent='この枠で振替';
                button.addEventListener('click',()=>makeup(id,x.date,x.period)); row.append(span,button); el.appendChild(row);
              }
            }catch(e){const el=$('slots-'+id);if(el)el.textContent=e.message||'振替枠の取得に失敗しました'}
          }
          async function absence""", s, count=1, flags=re.S)
          if 'async function absence(id)' not in s: raise SystemExit('loadSlots replacement failed')
          s=s.replace("button.addEventListener('click',doLogin);", "button.addEventListener('click',doLogin);")
          p.write_text(s)
          PY
      - name: Validate source
        run: |
          npx tsc --noEmit
          python3 - <<'PY'
          import re,subprocess
          s=open('src/index.ts',encoding='utf-8').read(); m=re.search(r'const html=`(.*?)`;\nfunction b64',s,re.S)
          if not m: raise SystemExit('html template not found')
          j=re.search(r'<script>(.*?)</script>',m.group(1),re.S)
          if not j: raise SystemExit('script block not found')
          open('/tmp/client.js','w',encoding='utf-8').write(j.group(1))
          raise SystemExit(subprocess.run(['node','--check','/tmp/client.js']).returncode)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.ts src/admin.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Fix UI final'
          git push
# trigger repair
