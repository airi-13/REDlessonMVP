name: Improve login feedback
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  improve:
    if: ${{ !contains(github.event.head_commit.message, 'Improve login feedback') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve student and admin login feedback
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/index.ts')
          s=p.read_text()
          old="""async function login(){try{const id=sid.value.trim(),password=pw.value;if(!id||!password)throw Error('IDとパスワードを入力してください');const d=await api('/api/login',{method:'POST',body:JSON.stringify({studentId:id,password})});if(d.role==='admin'){location.href='/admin';return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');who.textContent=d.name+'（'+d.studentId+'）';await load()}catch(e){msg.textContent=e.message}}"""
          new="""async function login(){const button=document.querySelector('.login-submit');try{const id=sid.value.trim(),password=pw.value;if(!id||!password)throw Error('IDとパスワードを入力してください');if(button){button.disabled=true;button.textContent='ログイン中…';button.style.opacity='.7';button.style.cursor='wait'}msg.textContent='';const d=await api('/api/login',{method:'POST',body:JSON.stringify({studentId:id,password})});if(d.role==='admin'){location.href='/admin';return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');who.textContent=d.name+'（'+d.studentId+'）';await load()}catch(e){msg.textContent='一致するログインデータがありません';if(button){button.disabled=false;button.textContent='ログイン';button.style.opacity='';button.style.cursor=''}}}"""
          if old not in s:
              raise SystemExit('student login function not found')
          p.write_text(s.replace(old,new,1))

          p=Path('src/admin.ts')
          s=p.read_text()
          old="""async function login(){try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({user:au.value,password:ap.value})});loginBox(false);await loadAll()}catch(e){msg.textContent=e.message}}"""
          new="""async function login(){const button=document.querySelector('.login-submit');try{if(!au.value.trim()||!ap.value)throw Error('IDとパスワードを入力してください');if(button){button.disabled=true;button.textContent='ログイン中…';button.style.opacity='.7';button.style.cursor='wait'}msg.textContent='';await api('/api/admin/login',{method:'POST',body:JSON.stringify({user:au.value,password:ap.value})});loginBox(false);await loadAll()}catch(e){msg.textContent='一致するログインデータがありません';if(button){button.disabled=false;button.textContent='ログイン';button.style.opacity='';button.style.cursor=''}}}"""
          if old not in s:
              raise SystemExit('admin login function not found')
          p.write_text(s.replace(old,new,1))
      - name: Typecheck
        run: |
          npm install
          npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.ts src/admin.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Improve login feedback'
          git push
