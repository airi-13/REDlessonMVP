name: Fix admin UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix admin UI') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Normalize admin UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/admin.ts')
          s=p.read_text()
          old=re.search(r'<style>.*?</style>',s,re.S)
          if not old:
              raise SystemExit('admin style block not found')
          css='''<style>body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f6f8;color:#202124}header{background:#fff;color:#202124;padding:14px 22px;border-top:3px solid #D13C18;box-shadow:0 1px 5px #00000012}header strong{font-size:18px;font-weight:700}main{max-width:1100px;margin:0 auto;padding:28px 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px;box-shadow:0 2px 10px #0000000a;margin-bottom:18px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row input,.row select{box-sizing:border-box;padding:10px 11px;border:1px solid #d1d5db;border-radius:8px;background:#fff;font:inherit}.row button,button{border:0;border-radius:8px;background:#D13C18;color:#fff;padding:9px 13px;font:inherit;font-weight:700;cursor:pointer}.row button:hover,button:hover{background:#B73212}.logout{margin-left:auto;background:#fff!important;color:#374151!important;border:1px solid #d1d5db!important;font-weight:600!important}.logout:hover{background:#f3f4f6!important}.app-head{display:flex;align-items:center;gap:12px}.app-head h2{margin:0}.muted{color:#6b7280}.hidden{display:none!important}input:focus,select:focus{outline:2px solid #D13C1844;border-color:#D13C18}.grid{display:grid;grid-template-columns:90px repeat(8,minmax(48px,1fr));border:1px solid #e5e7eb;border-right:0;border-bottom:0}.cell{min-height:42px;display:flex;align-items:center;justify-content:center;border-right:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;background:#fff}.cell.off{background:#f3f4f6}.grid input{accent-color:#D13C18}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:10px 8px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:middle}th{font-size:13px;color:#6b7280;font-weight:700}td input{box-sizing:border-box;padding:8px;border:1px solid #d1d5db;border-radius:7px;max-width:220px}.danger{background:#fff!important;color:#b42318!important;border:1px solid #f0b4ad!important}@media(max-width:700px){main{padding:18px 12px}.card{padding:17px}.row{align-items:stretch}.row input,.row select,.row button{width:100%}.grid{grid-template-columns:58px repeat(8,minmax(40px,1fr));overflow-x:auto}.cell{font-size:12px;min-height:38px}table{display:block;overflow-x:auto;white-space:nowrap}}}</style>'''
          s=s[:old.start()]+css+s[old.end():]
          s=s.replace('<header><strong>授業管理</strong></header>','<header><strong>授業管理</strong></header>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin.ts
          git diff --cached --quiet || git commit -m 'Fix admin UI'
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/fix-admin-ui.yml
          git commit -m 'Remove temporary admin UI workflow'
          git push
