name: Final UI clean
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  clean:
    if: ${{ !contains(github.event.head_commit.message, 'Final UI clean') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair login source and clean UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/index.ts')
          s=p.read_text()
          bad="\n},k,256);return b64(bits)===b}catch{return false}}"
          if bad in s:
              s=s.replace(bad,'',1)
          s=s.replace('<header><strong>授業管理</strong></header><main>', '<main>', 1)
          p.write_text(s)
          PY
      - name: Validate TypeScript
        run: |
          npm ci
          npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Final UI clean'
          git push
