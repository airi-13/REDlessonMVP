name: Modern login UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Modern login UI') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modernize login screens
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('src/index.ts'); s=p.read_text()
          s=s.replace('body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f7f7;color:#242424}header{display:none}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 2px 10px #0000000a}input:focus,select:focus{outline:2px solid #D13C1844;border-color:#D13C18}button{background:#D13C18!important;font-weight:700}button:hover{background:#A82F12!important}', 'body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f7f5;color:#1f2937;min-height:100vh}.card{background:#fff;border:0;border-radius:16px;box-shadow:0 12px 40px #0000000b}main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}.login-form{width:min(100%,360px);display:grid;gap:12px;padding:36px}.login-form label{display:none}.login-form input{width:100%;box-sizing:border-box;padding:14px 15px;border:1px solid #d9dde3;border-radius:10px;background:#fff;color:#111827;font:inherit;font-size:16px}.login-form input::placeholder{color:#9aa1aa}.login-form input:focus{outline:2px solid #D13C1833;border-color:#D13C18}.login-form button{width:100%;margin-top:4px;padding:14px 15px;border:0;border-radius:10px;background:#D13C18!important;color:#fff;font:inherit;font-weight:700;cursor:pointer}.login-form button:hover{background:#A82F12!important}.login-form .muted{min-height:20px;margin:2px 0 0;color:#b42318;text-align:center;font-size:13px}button{background:#D13C18!important;font-weight:700}button:hover{background:#A82F12!important}')
          s=s.replace('<div class="login-form"><label for="sid">ID</label><input id="sid" autocomplete="username"><label for="pw">パスワード</label><input id="pw" type="password" autocomplete="current-password"><button onclick="login()">ログイン</button><p id="msg" class="muted"></p></div>', '<div class="login-form"><input id="sid" autocomplete="username" placeholder="ID"><input id="pw" type="password" autocomplete="current-password" placeholder="パスワード"><button onclick="login()">ログイン</button><p id="msg" class="muted"></p></div>')
          p.write_text(s)

          p=Path('src/admin.ts'); s=p.read_text()
          s=s.replace('body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f6f8;color:#202124}header{display:none}', 'body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f7f5;color:#1f2937;min-height:100vh}header{display:none}')
          s=s.replace('.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px;box-shadow:0 2px 10px #0000000a;margin-bottom:18px}', '.card{background:#fff;border:0;border-radius:16px;padding:22px;box-shadow:0 12px 40px #0000000b;margin-bottom:18px}')
          s=s.replace('main{max-width:1100px;margin:0 auto;padding:28px 18px}', 'main{max-width:1100px;margin:0 auto;padding:28px 18px}.login-card{max-width:360px;margin:0 auto;padding:36px}.login-card h2{display:none}.login-card .row{display:grid;gap:12px}.login-card input{width:100%;box-sizing:border-box;padding:14px 15px;border:1px solid #d9dde3;border-radius:10px;background:#fff;color:#111827;font:inherit;font-size:16px}.login-card input::placeholder{color:#9aa1aa}.login-card input:focus{outline:2px solid #D13C1833;border-color:#D13C18}.login-card button{width:100%;padding:14px 15px;margin-top:4px;border:0;border-radius:10px;background:#D13C18;color:#fff;font:inherit;font-weight:700}.login-card #msg{text-align:center;font-size:13px;color:#b42318}')
          s=s.replace('<section id="login" class="card"><h2>管理者ログイン</h2><div class="row"><input id="au" placeholder="管理者ID"><input id="ap" type="password" placeholder="パスワード"><button onclick="login()">ログイン</button><p id="msg" class="muted"></p></div></section>', '<section id="login" class="card login-card"><h2>管理者ログイン</h2><div class="row"><input id="au" autocomplete="username" placeholder="ID"><input id="ap" type="password" autocomplete="current-password" placeholder="パスワード"><button onclick="login()">ログイン</button><p id="msg" class="muted"></p></div></section>')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.ts src/admin.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Modern login UI'
          git push
