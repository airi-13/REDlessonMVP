name: Fix login diagnostics

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Apply login fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text()
          changed = False

          old = """async function api(path,opt={}){\n  const controller=new AbortController();\n  const timer=setTimeout(()=>controller.abort(),10000);\n  try{\n    const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})},signal:controller.signal});\n    const d=await r.json().catch(()=>({}));\n    if(!r.ok)throw Error(d.error||'サーバーエラー');\n    return d;\n  }finally{clearTimeout(timer)}\n}"""
          new = """async function api(path,opt={}){\n  const controller=new AbortController();\n  const timer=setTimeout(()=>controller.abort(),10000);\n  try{\n    const r=await fetch(path,{...opt,credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},signal:controller.signal,cache:'no-store'});\n    const d=await r.json().catch(()=>({}));\n    if(!r.ok){const err=Error(d.error||'サーバーエラー');err.status=r.status;err.code=d.code;throw err}\n    return d;\n  }finally{clearTimeout(timer)}\n}"""
          if old in s:
            s = s.replace(old, new, 1); changed = True

          old = """  }catch(err){\n    showMessage(err?.name==='AbortError'?'通信がタイムアウトしました。もう一度お試しください':'IDまたはパスワードが違います');\n  }finally{"""
          new = """  }catch(err){\n    if(err?.name==='AbortError')showMessage('通信がタイムアウトしました。もう一度お試しください');\n    else if(err?.code==='AUTH_CONFIG')showMessage('ログイン設定に問題があります。管理者設定を確認してください');\n    else if(err?.code==='DB_ERROR')showMessage('データベースに接続できません。管理者に連絡してください');\n    else if(err?.code==='SESSION_ERROR')showMessage('ログインセッションを作成できません。管理者に連絡してください');\n    else if(err?.status===401)showMessage('IDまたはパスワードが違います');\n    else showMessage(err?.message||'ログインに失敗しました');\n  }finally{"""
          if old in s:
            s = s.replace(old, new, 1); changed = True

          old = """function json(x:any,status=200){return new Response(JSON.stringify(x),{status,headers:{'Content-Type':'application/json'}})}"""
          new = """function json(x:any,status=200){return new Response(JSON.stringify(x),{status,headers:{'Content-Type':'application/json','Cache-Control':'no-store'}})}"""
          if old in s:
            s = s.replace(old, new, 1); changed = True

          old = """if(req.method==='POST'&&u.pathname==='/api/login'){const b=await req.json<any>();const loginId=String(b.studentId||'').trim();if(loginId!==env.ADMIN_USER&&!/^1139\\d{5}$/.test(loginId))return json({error:'IDまたはパスワードが違います'},401);if(loginId===env.ADMIN_USER){if(b.password!==env.ADMIN_PASSWORD)return json({error:'IDまたはパスワードが違います'},401);return new Response(JSON.stringify({role:'admin'}),{headers:{'Content-Type':'application/json','Set-Cookie':cookie(await token(env,'admin','admin'))}})}const st=await env.DB.prepare('SELECT id,student_id,name,password_hash,active FROM students WHERE student_id=?').bind(loginId).first<any>();if(!st||!st.active||!(await verifyPassword(b.password,st.password_hash)))return json({error:'IDまたはパスワードが違います'},401);return new Response(JSON.stringify({role:'student',studentId:st.student_id,name:st.name}),{headers:{'Content-Type':'application/json','Set-Cookie':cookie(await token(env,String(st.id),'student'))}})}"""
          new = """if(req.method==='POST'&&u.pathname==='/api/login'){\n  let b:any;\n  try{b=await req.json<any>()}catch{return json({error:'リクエストが不正です',code:'BAD_REQUEST'},400)}\n  const loginId=String(b.studentId||'').trim();\n  if(!env.ADMIN_USER||!env.ADMIN_PASSWORD||!env.SESSION_SECRET)return json({error:'ログイン設定に問題があります',code:'AUTH_CONFIG'},500);\n  if(loginId!==env.ADMIN_USER&&!/^1139\\d{5}$/.test(loginId))return json({error:'IDまたはパスワードが違います'},401);\n  if(loginId===env.ADMIN_USER){\n    if(b.password!==env.ADMIN_PASSWORD)return json({error:'IDまたはパスワードが違います'},401);\n    try{return new Response(JSON.stringify({role:'admin'}),{headers:{'Content-Type':'application/json','Cache-Control':'no-store','Set-Cookie':cookie(await token(env,'admin','admin'))}})}\n    catch{return json({error:'ログインセッションを作成できません',code:'SESSION_ERROR'},500)}\n  }\n  let st:any;\n  try{st=await env.DB.prepare('SELECT id,student_id,name,password_hash,active FROM students WHERE student_id=?').bind(loginId).first<any>()}\n  catch{return json({error:'データベースに接続できません',code:'DB_ERROR'},500)}\n  if(!st||!st.active||!(await verifyPassword(b.password,st.password_hash)))return json({error:'IDまたはパスワードが違います'},401);\n  try{return new Response(JSON.stringify({role:'student',studentId:st.student_id,name:st.name}),{headers:{'Content-Type':'application/json','Cache-Control':'no-store','Set-Cookie':cookie(await token(env,String(st.id),'student'))}})}\n  catch{return json({error:'ログインセッションを作成できません',code:'SESSION_ERROR'},500)}\n}"""
          if old in s:
            s = s.replace(old, new, 1); changed = True

          if not changed:
            print('No matching login snippets; nothing to change.')
            raise SystemExit(0)
          p.write_text(s)
          PY

      - name: Commit login fixes
        run: |
          if git diff --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts
          git commit -m 'Diagnose and harden login flow'
          git push

      - name: Remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-login.yml || true
          git commit -m 'Remove one-off login fix workflow' || true
          git push || true
