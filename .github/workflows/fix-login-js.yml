name: Fix login JS
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix login DOM references
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('src/index.ts'), Path('src/admin.ts')]
          replacements = {
              "const id=sid.value.trim(),password=pw.value;": "const sidEl=document.getElementById('sid') as HTMLInputElement|null;const pwEl=document.getElementById('pw') as HTMLInputElement|null;const msgEl=document.getElementById('msg');const id=(sidEl?.value||'').trim(),password=pwEl?.value||'';",
              "msg.textContent='';": "if(msgEl)msgEl.textContent='';",
              "msg.textContent='一致するログインデータがありません';": "if(msgEl)msgEl.textContent='一致するログインデータがありません';",
              "if(!au.value.trim()||!ap.value)throw Error('IDとパスワードを入力してください');": "const auEl=document.getElementById('au') as HTMLInputElement|null;const apEl=document.getElementById('ap') as HTMLInputElement|null;const msgEl=document.getElementById('msg');if(!auEl?.value.trim()||!apEl?.value)throw Error('IDとパスワードを入力してください');",
              "body:JSON.stringify({user:au.value,password:ap.value})": "body:JSON.stringify({user:auEl?.value.trim()||'',password:apEl?.value||''})",
          }
          for p in files:
              s=p.read_text()
              old=s
              for a,b in replacements.items():
                  s=s.replace(a,b)
              if s==old:
                  print(f'No changes needed: {p}')
              else:
                  p.write_text(s)
                  print(f'Patched: {p}')
          PY
          git diff --check
          if git diff --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts src/admin.ts
          git commit -m 'Fix login form DOM handling'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-login-js.yml
          git add .github/workflows/fix-login-js.yml
          git diff --cached --quiet || git commit -m 'Remove temporary login fix workflow'
          git push || true
