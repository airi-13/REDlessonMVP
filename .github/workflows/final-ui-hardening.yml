name: Final UI hardening
on:
  push:
    branches: [main]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Finalize UI hardening') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Harden admin UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/admin.ts')
          s=p.read_text()
          old='body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f7f7;color:#242424}header{background:#d71920;color:#fff;padding:16px 22px;box-shadow:0 2px 10px #0002}'
          new='body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f7f7;color:#242424}main{max-width:1200px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:18px;border:1px solid #eee;box-shadow:0 2px 10px #0000000d}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hidden{display:none}.muted{color:#687386}.danger{color:#b42318}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:9px 8px;border-bottom:1px solid #e7e9ee;text-align:left}input,button,select{font:inherit;padding:10px;border:1px solid #ccd2dc;border-radius:8px}header{background:#d71920;color:#fff;padding:16px 22px;box-shadow:0 2px 10px #0002}'
          if old not in s: raise SystemExit('style anchor not found')
          s=s.replace(old,new,1)
          old2="weekly.innerHTML='<table><tr><th>生徒</th><th>曜日</th><th>コマ</th><th></th></tr>'+d.items.map(x=>'<tr><td>'+x.studentId+' '+x.name+'</td>"
          new2="weekly.innerHTML='<table><tr><th>生徒</th><th>曜日</th><th>コマ</th><th></th></tr>'+d.items.map(x=>'<tr><td>'+x.studentId+' '+esc(x.name)+'</td>"
          if old2 in s: s=s.replace(old2,new2,1)
          old3="lessons.innerHTML='<table><tr><th>日付</th><th>生徒</th><th>コマ</th><th>種別</th><th>状態</th></tr>'+d.items.map(x=>'<tr><td>'+x.date+'</td><td>'+x.studentId+' '+x.name+'</td>"
          new3="lessons.innerHTML='<table><tr><th>日付</th><th>生徒</th><th>コマ</th><th>種別</th><th>状態</th></tr>'+d.items.map(x=>'<tr><td>'+x.date+'</td><td>'+x.studentId+' '+esc(x.name)+'</td>"
          if old3 in s: s=s.replace(old3,new3,1)
          marker="async function api(p,o={})"
          helper="function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\\\"/g,'&quot;').replace(/'/g,'&#39;')}"+marker
          if 'function esc(v)' not in s: s=s.replace(marker,helper,1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-ui-hardening.yml
          git add src/admin.ts
          git commit -m "Finalize UI hardening"
          git push
