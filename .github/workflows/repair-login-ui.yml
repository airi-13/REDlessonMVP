name: Repair login UI
on:
  push:
    branches: [main]
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Repair login UI') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace login script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/index.ts')
          s=p.read_text()
          new=r'''<script>
          const $=id=>document.getElementById(id);
          async function api(path,opt={}){
            const controller=new AbortController();
            const timer=setTimeout(()=>controller.abort(),10000);
            try{
              const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})},signal:controller.signal});
              const d=await r.json().catch(()=>({}));
              if(!r.ok)throw Error(d.error||'サーバーエラー');
              return d;
            }finally{clearTimeout(timer)}
          }
          function showMessage(text){const el=$('msg');if(el)el.textContent=text||''}
          function togglePassword(){const el=$('pw');const icon=$('eyeIcon');if(!el)return;el.type=el.type==='password'?'text':'password';if(icon)icon.innerHTML=el.type==='password'?'<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/>':'<path d="M3 3l18 18"/><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3.2 3.9M6.2 6.3C3.4 8.1 2 12 2 12s3.5 6 10 6a10.7 10.7 0 0 0 4.1-.8"/>'}
          async function login(e){
            if(e)e.preventDefault();
            const button=document.querySelector('.login-submit');
            const id=($('sid')?.value||'').trim(),password=$('pw')?.value||'';
            if(!id||!password){showMessage('IDとパスワードを入力してください');return}
            if(button){button.disabled=true;button.textContent='ログイン中…';button.style.opacity='.7';button.style.cursor='wait'}
            showMessage('');
            try{
              const d=await api('/api/login',{method:'POST',body:JSON.stringify({studentId:id,password})});
              if(d.role==='admin'){location.href='/admin';return}
              $('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=d.name+'（'+d.studentId+'）';await load();
            }catch(err){
              showMessage(err?.name==='AbortError'?'通信がタイムアウトしました。もう一度お試しください':'IDまたはパスワードが違います');
            }finally{
              if(button){button.disabled=false;button.textContent='ログイン';button.style.opacity='';button.style.cursor=''}
            }
          }
          async function load(){try{const d=await api('/api/me/lessons');$('lessons').innerHTML=d.lessons.map(x=>'<div class="lesson"><b>'+x.date+' '+x.period+'限</b> '+x.start+'–'+x.end+' <span class="muted">'+x.statusLabel+'</span>'+(x.canAbsence?' <button onclick="absence('+x.id+')">欠席にする</button>':'')+'</div>').join('')||'<p class="muted">授業はありません。</p>';const e=await api('/api/me/entitlements');$('entitlements').innerHTML='';for(const x of e.entitlements){const box=document.createElement('div');box.className='lesson';box.innerHTML='<b>'+x.originalDate+' '+x.originalPeriod+'限</b> の振替権<div id="slots-'+x.id+'" class="muted">候補を読み込み中…</div>';$('entitlements').appendChild(box);loadSlots(x.id)}if(!e.entitlements.length)$('entitlements').innerHTML='<p class="muted">利用可能な振替はありません。</p>'}catch(e){showMessage(e.message)}}
          async function loadSlots(id){try{const d=await api('/api/me/makeup-slots?entitlementId='+encodeURIComponent(id));const el=$('slots-'+id);if(!el)return;if(!d.slots.length){el.textContent='現在、選択できる振替枠はありません。';return}el.innerHTML=d.slots.map(x=>'<div class="slot"><span>'+x.date+'（'+x.weekdayLabel+'） '+x.period+'限 '+x.start+'–'+x.end+'</span><button onclick="makeup('+id+',\''+x.date+'\','+x.period+')">この枠で振替</button></div>').join('')}catch(e){const el=$('slots-'+id);if(el)el.textContent=e.message}}
          async function absence(id){if(confirm('この授業を欠席登録しますか？')){try{await api('/api/me/absence',{method:'POST',body:JSON.stringify({lessonId:id})});await load()}catch(e){alert(e.message)}}}
          async function makeup(id,date,period){if(!confirm(date+' '+period+'限で振替登録しますか？'))return;try{await api('/api/me/makeup',{method:'POST',body:JSON.stringify({entitlementId:id,date,period})});await load()}catch(e){alert(e.message)}}
          async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
          document.addEventListener('DOMContentLoaded',()=>{
            const form=document.querySelector('.login-form');
            if(form)form.addEventListener('submit',login);
            const button=document.querySelector('.login-submit');
            if(button)button.addEventListener('click',login);
            ['sid','pw'].forEach(id=>$(id)?.addEventListener('keydown',e=>{if(e.key==='Enter')login(e)}));
            (async()=>{try{const d=await api('/api/me');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=d.name+'（'+d.studentId+'）';await load()}catch(_){}})();
          });
          </script>'''
          ns=re.sub(r'<script>.*?</script>',new,s,count=1,flags=re.S)
          if ns==s: raise SystemExit('login script not found')
          p.write_text(ns)
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Repair login UI'
          git push
