name: Fix unified login
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip login patch]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Repair login flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/index.ts')
          s=p.read_text()
          bad="\n},k,256);return b64(bits)===b}catch{return false}}"
          if bad in s:
              s=s.replace(bad,'',1)
          old="const loginId=String(b.studentId||'').trim();"
          new="const loginId=String(b.studentId||'').trim();if(loginId!=='kanri'&&!/^\\d{9}$/.test(loginId))return json({error:'IDまたはパスワードが違います'},401);"
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate TypeScript
        run: npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.ts
          git diff --cached --quiet || git commit -m 'Fix 9-digit student login authentication [skip login patch]'
          git push
