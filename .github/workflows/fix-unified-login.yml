name: Fix unified login
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip login patch]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch login flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/index.ts')
          s=p.read_text()

          verifier = """async function verifyPassword(password:string,stored:string){
            if(typeof stored!=='string')return false;
            if(stored===password)return true;
            try{
              const[s,b]=stored.split('$');
              if(!s||!b)return false;
              const salt=unb64(s),k=await crypto.subtle.importKey('raw',textBytes(password),'PBKDF2',false,['deriveBits']);
              const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt.buffer as ArrayBuffer,iterations:120000,hash:'SHA-256'},k,256);
              return b64(bits)===b;
            }catch{return false}
          }"""

          pattern = r"async function verifyPassword\(password:string,stored:string\)\{.*?catch\{return false\}\}"
          s2,n=re.subn(pattern,verifier,s,count=1,flags=re.S)
          if n==0:
              raise SystemExit('verifyPassword function not found')
          s=s2

          s=s.replace(
              "const loginId=String(b.studentId||'').trim();",
              "const loginId=String(b.studentId||'').trim();if(loginId!=='kanri'&&!/^\\d{9}$/.test(loginId))return json({error:'IDまたはパスワードが違います'},401);"
          )

          s=re.sub(r"<script>window\.login=async function\(\).*?</script>","",s,flags=re.S)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate TypeScript
        run: npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.ts
          git diff --cached --quiet || git commit -m 'Fix 9-digit student login authentication [skip login patch]'
          git push
