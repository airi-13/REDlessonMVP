name: Fix unified login
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix 9-digit student login authentication') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch login flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/index.ts')
          s=p.read_text()

          s=re.sub(
              r"async function verifyPassword\(password:string,stored:string\)\{.*?\n?\}",
              """async function verifyPassword(password:string,stored:string){
            if(typeof stored!=='string')return false;
            if(stored===password)return true;
            try{
              const[s,b]=stored.split('$');
              if(!s||!b)return false;
              const salt=unb64(s),k=await crypto.subtle.importKey('raw',textBytes(password),'PBKDF2',false,['deriveBits']);
              const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt.buffer as ArrayBuffer,iterations:120000,hash:'SHA-256'},k,256);
              return b64(bits)===b;
            }catch{return false}
          }""",
              s,count=1,flags=re.S
          )

          # Enforce the corrected student ID format without changing the
          # existing admin credentials/configuration.
          s=s.replace(
              "const loginId=String(b.studentId||'').trim();",
              "const loginId=String(b.studentId||'').trim();if(loginId!=='kanri'&&!/^\\d{9}$/.test(loginId))return json({error:'IDまたはパスワードが違います'},401);"
          )

          # Remove the duplicate client-side login implementation.
          s=re.sub(r"<script>window\.login=async function\(\).*?</script>","",s,flags=re.S)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.ts
          git diff --cached --quiet || git commit -m 'Fix 9-digit student login authentication'
          git push
