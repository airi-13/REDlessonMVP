name: Fix login JS 2
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove TypeScript-only syntax from browser JS
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['src/index.ts','src/admin.ts']:
              p=Path(name)
              s=p.read_text()
              old=s
              s=s.replace(" as HTMLInputElement|null", "")
              if s != old:
                  p.write_text(s)
                  print('patched', name)
          PY
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts src/admin.ts
          git commit -m 'Fix browser login script syntax'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-login-js2.yml
          git add .github/workflows/fix-login-js2.yml
          git diff --cached --quiet || git commit -m 'Remove temporary login syntax fix workflow'
          git push || true
