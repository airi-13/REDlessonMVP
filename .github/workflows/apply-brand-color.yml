name: Apply brand color

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply brand color') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply #D13C18 to UI
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('src/index.ts', 'src/admin.ts'):
              p=Path(name)
              s=p.read_text()
              s=s.replace('background:#202124!important;color:#fff!important', 'background:#D13C18!important;color:#fff!important')
              s=s.replace('background:#111!important', 'background:#A52F12!important')
              s=s.replace('outline:2px solid #9ca3af;border-color:#6b7280', 'outline:2px solid #D13C1844;border-color:#D13C18')
              s=s.replace('header{background:#fff;', 'header{background:#fff;border-top:3px solid #D13C18;')
              p.write_text(s)
          PY
          rm .github/workflows/apply-brand-color.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts src/admin.ts .github/workflows/apply-brand-color.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Apply brand color #D13C18'
          git push
