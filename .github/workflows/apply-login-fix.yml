name: Apply login runtime fix

on:
  push:
    branches: [main]

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[login-fix]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch login UI and favicon handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text()

          s = s.replace('<button type="button" class="password-toggle" onclick="togglePassword()"', '<button type="button" class="password-toggle"')
          s = s.replace('<button class="login-submit" onclick="login()">ログイン</button>', '<button type="button" class="login-submit">ログイン</button>')
          s = s.replace('<button class="logout" onclick="logout()">ログアウト</button>', '<button type="button" class="logout">ログアウト</button>')
          s = s.replace('<meta name="viewport" content="width=device-width,initial-scale=1">', '<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">')

          old = """document.addEventListener('DOMContentLoaded',()=>{\n  const form=document.querySelector('.login-form');\n  if(form)form.addEventListener('submit',login);\n  const button=document.querySelector('.login-submit');\n  if(button)button.addEventListener('click',login);"""
          new = """document.addEventListener('DOMContentLoaded',()=>{\n  const button=document.querySelector('.login-submit');\n  if(button)button.addEventListener('click',login);\n  const passwordToggle=document.querySelector('.password-toggle');\n  if(passwordToggle)passwordToggle.addEventListener('click',togglePassword);\n  const logoutButton=document.querySelector('.logout');\n  if(logoutButton)logoutButton.addEventListener('click',logout);"""
          if old not in s:
              raise SystemExit('expected login event block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts
          git rm .github/workflows/apply-login-fix.yml
          git commit -m '[login-fix] Remove inline login handlers and favicon 401'
          git push
