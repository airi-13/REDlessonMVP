name: Fix admin login UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Modern login UI') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply same modern login design to admin
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('src/admin.ts')
          s=p.read_text()
          css='''body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f7f5;color:#1f2937;min-height:100vh}header{display:none}main{max-width:1100px;margin:0 auto;padding:28px 18px}.card{background:#fff;border:0;border-radius:16px;padding:22px;box-shadow:0 12px 40px #0000000b;margin-bottom:18px}.login-card{max-width:590px;margin:90px auto 0;padding:0;overflow:hidden}.login-card h2{display:none}.login-card .row{display:grid;gap:12px;padding:72px 56px}.login-card .row:before{content:"RED";display:block;text-align:center;margin:0 0 34px;font-size:66px;line-height:1;font-weight:800;letter-spacing:.08em;color:#D13C18}.login-card .field{position:relative}.login-card .field input{width:100%;height:72px;box-sizing:border-box;padding:0 52px 0 76px;border:1px solid #d9dde3;border-radius:14px;background:#fff;color:#111827;font:inherit;font-size:17px}.login-card .field input::placeholder{color:#9aa1aa}.login-card .field input:focus{outline:none;border-color:#D13C18;box-shadow:0 0 0 3px #D13C1818}.field-icon{position:absolute;left:25px;top:50%;transform:translateY(-50%);width:25px;height:25px;color:#87919f;pointer-events:none}.password-toggle{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0!important;padding:0!important;background:transparent!important;color:#87919f!important;display:grid;place-items:center;cursor:pointer}.password-toggle:hover{background:#f5f6f8!important}.password-toggle svg{width:22px;height:22px}.login-card .login-submit{width:100%;height:72px;margin-top:18px;border:0;border-radius:14px;background:#D13C18!important;color:#fff;font:inherit;font-size:19px;font-weight:700}.login-card #msg{min-height:20px;margin:0;text-align:center;font-size:13px;color:#b42318}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row input,.row select{box-sizing:border-box;padding:10px 11px;border:1px solid #d1d5db;border-radius:8px;background:#fff;font:inherit}.row button,button{border:0;border-radius:8px;background:#D13C18;color:#fff;padding:9px 13px;font:inherit;font-weight:700;cursor:pointer}.row button:hover,button:hover{background:#A82F12}.logout{margin-left:auto;background:#fff!important;color:#374151!important;border:1px solid #d1d5db!important;font-weight:600!important}.logout:hover{background:#f3f4f6!important}.app-head{display:flex;align-items:center;gap:12px}.app-head h2{margin:0}.muted{color:#6b7280}.hidden{display:none!important}input:focus,select:focus{outline:2px solid #D13C1844;border-color:#D13C18}.grid{display:grid;grid-template-columns:90px repeat(8,minmax(48px,1fr));border:1px solid #e5e7eb;border-right:0;border-bottom:0}.cell{min-height:42px;display:flex;align-items:center;justify-content:center;border-right:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;background:#fff}.cell.off{background:#f3f4f6}.grid input{accent-color:#D13C18}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:10px 8px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:middle}th{font-size:13px;color:#6b7280;font-weight:700}td input{box-sizing:border-box;padding:8px;border:1px solid #d1d5db;border-radius:7px;max-width:220px}.danger{background:#fff!important;color:#b42318!important;border:1px solid #f0b4ad!important}@media(max-width:700px){main{padding:18px 12px}.login-card{margin:32px auto 18px}.login-card .row{padding:48px 24px}.login-card .row:before{font-size:52px;margin-bottom:28px}.login-card .field input,.login-card .login-submit{height:62px}.login-card .field input{padding-left:64px}.field-icon{left:21px}.row{align-items:stretch}.row input,.row select,.row button{width:100%}.grid{grid-template-columns:58px repeat(8,minmax(40px,1fr));overflow-x:auto}.cell{font-size:12px;min-height:38px}table{display:block;overflow-x:auto;white-space:nowrap}}'''
          s=re.sub(r'<style>.*?</style>','<style>'+css+'</style>',s,count=1,flags=re.S)
          s=re.sub(r'<section id="login" class="card">.*?</section>', '<section id="login" class="card login-card"><h2>管理者ログイン</h2><div class="row"><div class="field"><svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4 3.2-6 8-6s7.3 2 8 6"/></svg><input id="au" autocomplete="username" placeholder="ID"></div><div class="field"><svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="ap" type="password" autocomplete="current-password" placeholder="パスワード"><button type="button" class="password-toggle" onclick="togglePassword()" aria-label="パスワードを表示"><svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div><button class="login-submit" onclick="login()">ログイン</button><p id="msg" class="muted"></p></div></section>', s, count=1, flags=re.S)
          s=s.replace('async function login(){','function togglePassword(){const el=document.getElementById("ap");const icon=document.getElementById("eyeIcon");if(!el)return;el.type=el.type==="password"?"text":"password";icon.innerHTML=el.type==="password"?\'<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/>\':\'<path d="M3 3l18 18"/><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3.2 3.9M6.2 6.3C3.4 8.1 2 12 2 12s3.5 6 10 6a10.7 10.7 0 0 0 4.1-.8"/>\'}async function login(){',1)
          p.write_text(s)
      - name: Typecheck
        run: |
          npm install
          npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/admin.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Modern login UI'
          git push
